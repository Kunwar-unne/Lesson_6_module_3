<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<style>

     body { position: relative;}
    .safari-slide {height: 200px; text-align: center; padding-top: 75px; font-size: 1.8rem; color: rgb(0, 0, 0);}
    .slide-forest {background: darkgreen;}
    .slide-ocean{background: steelblue;}
    .slide-desert {background-color: orange;}
    .section {padding: 70px 20px; min-height: 300px;}
    #forest {background: rgb(108, 154, 108);}
    #ocean {background: rgb(80, 120, 155);}
    #desert {background: rgb(247, 247, 125);}
</style>
</head>
<body data-spy="scroll" data-target="#safariNav" data-offset="60">

    <!--TOPIC 1, 2, AND 3 - Carousel-->
    <div id="safariCarousel" class="carousel slide" data-ride="carousel">
        <ol class="carousel-indicators">
            <li data-target="safariCarousel" data-slide-to="0" class="active"></li>
            <li data-target="safariCarousel" data-slide-to="1"></li>
        </ol>
        <div class="carousel-inner">
            <div class="carousel-item activate safari-slide slide-forest">Forest Safari</div>
            <div class="carousel-item activate safari-slide slide-ocean">Ocean Safari</div>
            <div class="carousel-item activate safari-slide slide-desert">Desert Safari</div>
        </div>
    </div>
<a class="carousel-control-prev" href="#SafariCarousel"></a>
    
</body>
</html>
